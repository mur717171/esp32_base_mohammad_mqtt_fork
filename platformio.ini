; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3_reversetft]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino

; Match the Serial Monitor speed to your code
monitor_speed = 115200

; Crucial for ESP32-S3: Forces Serial.print outputs to route through the USB-C port
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Ignore Errant Libraries Which Are Automatically Included for ESP32-S3 Platforms.
lib_ignore = 
    Pico PIO USB

; Add dependencies here as required:
lib_deps =
    adafruit/Adafruit MAX1704X @ ^1.0.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit TestBed @ ^1.1.2
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    arduino-libraries/ArduinoMqttClient @ ^0.1.8
    bblanchon/ArduinoJson @ ^6.21.3